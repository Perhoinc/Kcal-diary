name: Open Food Facts probe (temporary)
on:
  push:
    branches: [main]
    paths: [".github/workflows/off-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          O=tools/off-probe.txt; : > $O
          for U in \
            "https://world.openfoodfacts.org/cgi/search.pl?search_terms=havredryck&search_simple=1&action=process&json=1&page_size=6&fields=code,product_name,product_name_sv,brands,quantity,nutriments,nutrition_data_per&tagtype_0=countries&tag_contains_0=contains&tag_0=sweden" \
            "https://se.openfoodfacts.org/cgi/search.pl?search_terms=havregryn&search_simple=1&action=process&json=1&page_size=6&fields=code,product_name,product_name_sv,brands,quantity,nutriments" \
            "https://search.openfoodfacts.org/search?q=havredryck&page_size=4&langs=sv&fields=code,product_name,brands,quantity,nutriments,countries_tags" \
            "https://world.openfoodfacts.org/api/v2/product/7340011358701.json?fields=code,product_name,brands,nutriments" ; do
            echo "===== $U" >> $O
            curl -sS -m 60 -D - -o /tmp/b -H "Origin: https://perhoinc.github.io" -H "User-Agent: KcalDiary/1.0 (probe)" "$U" | grep -i '^HTTP\|access-control\|content-type\|retry\|ratelimit' >> $O || echo "curl failed" >> $O
            head -c 2500 /tmp/b | tr -d '\r' >> $O; echo >> $O
          done
          echo "===== preflight-free check done" >> $O
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $O; git commit -m "Open Food Facts probe result (temporary)"; git pull --rebase -q origin main; git push
