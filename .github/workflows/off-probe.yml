name: Open Food Facts probe (temporary)
on:
  push:
    branches: [main]
    paths: [".github/workflows/off-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          O=tools/off-probe.txt; : > $O
          F="code,product_name,product_name_sv,brands,quantity,product_quantity_unit,nutriments"
          probe(){ for i in 1 2 3; do
              curl -sS -m 90 -o /tmp/b -D /tmp/h -w "  try $i: code=%{http_code} time=%{time_total}s size=%{size_download}\n" -H "Origin: https://perhoinc.github.io" -H "User-Agent: Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1" "$1" >> $O 2>&1 || echo "  try $i: curl failed" >> $O
              grep -i 'access-control-allow-origin\|^content-type\|retry-after\|x-ratelimit' /tmp/h | sed 's/^/    /' >> $O
              sleep 7; done
            echo "    body: $(head -c 300 /tmp/b | tr -d '\r\n')" >> $O; }
          echo "== se search.pl (as the app calls it)" >> $O
          probe "https://se.openfoodfacts.org/cgi/search.pl?search_terms=havredryck&search_simple=1&action=process&json=1&page_size=40&fields=$F"
          echo "== se search.pl, page_size 20, no nutriments field list" >> $O
          probe "https://se.openfoodfacts.org/cgi/search.pl?search_terms=skyr&search_simple=1&action=process&json=1&page_size=20"
          echo "== world search.pl" >> $O
          probe "https://world.openfoodfacts.org/cgi/search.pl?search_terms=havredryck&search_simple=1&action=process&json=1&page_size=20&fields=$F"
          echo "== search-a-licious" >> $O
          probe "https://search.openfoodfacts.org/search?q=havredryck&page_size=20&langs=sv&fields=code,product_name,brands,quantity,product_quantity_unit,nutriments,countries_tags"
          echo "== search-a-licious, full headers" >> $O
          curl -sS -m 60 -D - -o /dev/null -H "Origin: https://perhoinc.github.io" "https://search.openfoodfacts.org/search?q=skyr&page_size=2" | sed 's/^/    /' >> $O
          echo "== search-a-licious, preflight" >> $O
          curl -sS -m 60 -X OPTIONS -D - -o /dev/null -H "Origin: https://perhoinc.github.io" -H "Access-Control-Request-Method: GET" "https://search.openfoodfacts.org/search?q=skyr" | sed 's/^/    /' >> $O
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $O; git commit -m "Open Food Facts probe result (temporary)"; git pull --rebase -q origin main; git push
