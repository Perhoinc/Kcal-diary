name: Update food database
# Fetches Livsmedelsverket's food database on GitHub's servers and saves foods.json for the app.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"
  push:
    branches: [main]
    paths:
      - "tools/fetch_foods.py"
      - ".github/workflows/foods.yml"
permissions:
  contents: write
concurrency: foods
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and trim the database
        run: python3 tools/fetch_foods.py
      - name: Save the result in the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/foods-log.txt
          [ -f foods.json ] && git add foods.json
          git diff --cached --quiet || git commit -m "Update food database from Livsmedelsverket"
          git pull --rebase -q origin main && git push
