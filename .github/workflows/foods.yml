name: Update food database
# Fetches Livsmedelsverket's food database and Open Food Facts' Swedish products on GitHub's servers
# and saves foods.json and products-se.json for the app.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"
  push:
    branches: [main]
    paths:
      - "tools/fetch_foods.py"
      - "tools/fetch_off.py"
      - ".github/workflows/foods.yml"
permissions:
  contents: write
concurrency: foods
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and trim Livsmedelsverket's database
        run: python3 tools/fetch_foods.py
      - name: Fetch Open Food Facts' products sold in Sweden
        run: python3 tools/fetch_off.py
      - name: Save the result in the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/foods-log.txt tools/off-log.txt
          [ -f foods.json ] && git add foods.json
          [ -f products-se.json ] && git add products-se.json
          git diff --cached --quiet || git commit -m "Update food databases (Livsmedelsverket, Open Food Facts)"
          git pull --rebase -q origin main && git push
